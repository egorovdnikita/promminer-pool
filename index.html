<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promminer Pool — прототип</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 0. GILROY =====
   Gilroy — коммерческий шрифт, его нет в Google Fonts и его нельзя тянуть с CDN.
   Подключаем локально установленный Gilroy (на машине дизайнера он есть) —
   тогда прототип рендерится «как в макете». Fallback — Manrope (есть кириллица). */
@font-face{font-family:'Gilroy';font-weight:400;font-style:normal;font-display:swap;
  src:local('Gilroy Regular'),local('Gilroy-Regular'),local('Gilroy')}
@font-face{font-family:'Gilroy';font-weight:500;font-style:normal;font-display:swap;
  src:local('Gilroy Medium'),local('Gilroy-Medium')}
@font-face{font-family:'Gilroy';font-weight:600;font-style:normal;font-display:swap;
  src:local('Gilroy SemiBold'),local('Gilroy-SemiBold'),local('Gilroy Semibold')}
@font-face{font-family:'Gilroy';font-weight:700;font-style:normal;font-display:swap;
  src:local('Gilroy Bold'),local('Gilroy-Bold')}
@font-face{font-family:'Gilroy';font-weight:800;font-style:normal;font-display:swap;
  src:local('Gilroy ExtraBold'),local('Gilroy-ExtraBold'),local('Gilroy Extrabold')}

/* ===== 1. ТОКЕНЫ (💙 Дизайн-система) ===== */
:root{
  --accent:#7086fc; --accent-sub:#7086fc1f; --accent-ghost:#7086fc12;
  --bg:#f3f4f6; --surface:#fff; --bg3:#e5e7eb;
  --c1:#111827; --c2:#6b7280; --c3:#9ca3af;
  --pos:#22c55e; --warn:#f59e0b; --neg:#ef4444; --neu:#6b7280;
  --border:#6b728029; --ctrl:#6b72801f; --ctrl2:#6b728014;
  --r-xs:4px; --r-s:12px; --r-m:16px; --r-l:24px; --r-f:999px;
  --shadow:0 4px 24px 0 #CBD0E966;
  --font:'Gilroy','Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
  --sb:252px;
  /* размеры контролов по DS */
  --h-btn:48px; --h-btn-sm:40px; --h-field:56px; --h-ctrl:48px;
  /* типографика: Body/M 16-20, Body/S 14-18, Caption/M 12-16 */
  --fs-m:16px; --lh-m:20px; --fs-s:14px; --lh-s:18px; --fs-c:12px; --lh-c:16px;
}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){}}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--c1);font-size:var(--fs-m);line-height:var(--lh-m);font-weight:500;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%}
a{color:var(--accent);text-decoration:none}
svg{display:block;flex:0 0 auto}
.mono{font-variant-numeric:tabular-nums}
.h3{font-size:32px;line-height:38px;font-weight:600;letter-spacing:0}
.cap{font-size:var(--fs-c);line-height:var(--lh-c);font-weight:500}
.bs{font-size:var(--fs-s);line-height:var(--lh-s)}
.dim{color:var(--c3)}.mut{color:var(--c2)}
.row{display:flex;align-items:center;gap:8px}
.spacer{margin-left:auto}

/* ===== 2. КАРКАС ===== */
.app{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:0 0 var(--sb);background:var(--bg);position:sticky;top:0;height:100vh;padding:0 0 16px;display:flex;flex-direction:column;transition:width .18s,flex-basis .18s}
body.mini .sb{--sb:72px;width:72px;flex-basis:72px}
body.mini .sb .lbl,body.mini .sb .chev,body.mini .kids{display:none}
.logo{display:flex;align-items:center;gap:8px;height:72px;padding:24px 24px 0;flex:0 0 auto}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;font-style:normal}
.logo b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.logo span{font-size:9px;letter-spacing:.22em;color:var(--accent);font-weight:800}
.nav{display:flex;flex-direction:column;gap:0;overflow-y:auto;padding:12px 12px 0}
.ni{display:flex;align-items:center;gap:8px;padding:0 12px;height:var(--h-ctrl);border-radius:var(--r-m);color:var(--c1);background:transparent;font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;position:relative;width:100%}
.nic{color:var(--c3);display:flex;flex:0 0 auto}
.ni.on .nic,.ni.act .nic{color:var(--accent)}
.ni:hover{background:var(--ctrl2)}
.ni.on{background:var(--surface);color:var(--c1)}
.ni.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:4px 0 0 4px;background:var(--accent)}
.ni .chev{margin-left:auto;color:var(--c1);display:flex;transition:transform .15s}
.ni.open .chev{transform:rotate(180deg)}
.kids{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px}
.kid{padding:11px 12px 11px 44px;border-radius:var(--r-m);font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;color:var(--c2);position:relative}
.kid:hover{color:var(--c1)}
.kid.on{color:var(--accent)}
.kid.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:4px 0 0 4px;background:var(--accent)}
.sep{height:1px;background:var(--border);margin:12px 24px}
.mini-btn{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 8px;margin:auto 16px 0;border-radius:var(--r-m);color:var(--c3);font-size:var(--fs-m);line-height:var(--lh-m);font-weight:600}
.mini-btn:hover{background:var(--ctrl2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page{padding:16px 24px 0;width:100%}

/* header */
/* Хедер по DS: белая панель со скруглением 24 снизу */
.top{background:var(--surface);border-radius:0 0 var(--r-l) var(--r-l);padding:20px 8px}
.toprow{display:flex;align-items:center;gap:16px;padding:0 16px}
.top .h3{flex:1;min-width:0}
.hgroup{display:flex;align-items:center;gap:16px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:1px solid var(--border);border-radius:var(--r-m);background:transparent;font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;color:var(--c1);white-space:nowrap;position:relative}
.hbtn:hover{background:var(--ctrl2)}
.hbtn.sq{width:48px;padding:0}
.hbtn.tight{padding:0 12px;gap:4px}
.hbtn .i3{color:var(--c3);display:flex}
.pill{display:inline-flex;align-items:center;gap:8px;height:var(--h-ctrl);padding:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;white-space:nowrap}
.pill:hover{background:var(--ctrl2)}
.pill.sq{border-radius:var(--r-m);height:var(--h-ctrl)}
.pill.flat{background:var(--ctrl);border-color:transparent}
.ib{width:var(--h-ctrl);height:var(--h-ctrl);border-radius:var(--r-m);background:transparent;border:1px solid var(--border);display:grid;place-items:center;position:relative;color:var(--c3)}
.ib:hover{background:var(--ctrl2);color:var(--c1)}
.ib.sm{width:var(--h-btn-sm);height:var(--h-btn-sm);border-radius:var(--r-s)}
.bdg{position:absolute;left:21px;top:7px;min-width:20px;height:20px;padding:0 4px;border-radius:20px;background:var(--neg);color:#fff;font-size:var(--fs-c);line-height:var(--lh-c);font-weight:600;display:grid;place-items:center}
.subbar{display:flex;align-items:center;gap:10px;padding-bottom:12px;flex-wrap:wrap}
.subbar .rate{font-size:12px;color:var(--c3);font-weight:600}

/* popovers */
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:40;background:var(--surface);border-radius:var(--r-s);box-shadow:0 12px 40px #0000001f;padding:6px;min-width:230px;max-height:60vh;overflow:auto}
.pop.left{right:auto;left:0}
.pop b.ph{display:block;font-size:12px;color:var(--c3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 6px}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;min-height:var(--h-ctrl);border-radius:var(--r-s);font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600}
.pop button:hover{background:var(--ctrl2)}
.pop button.on{background:var(--accent-sub);color:var(--accent)}
.pop .hr{height:1px;background:var(--border);margin:5px 8px}
.note{display:flex;gap:10px;padding:10px;border-radius:var(--r-xs);align-items:flex-start}
.note:hover{background:var(--ctrl2)}
.note i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:0 0 auto}
.note.read i{background:var(--bg3)}
.note div{min-width:0}
.note b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.note p{font-size:12px;color:var(--c2);font-weight:500}
.note span{font-size:12px;color:var(--c3);font-weight:600}

/* cards */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:18px;line-height:22px;font-weight:800}
.hero{background:var(--accent);border-radius:var(--r-s);padding:12px 14px;color:#fff;display:flex;gap:12px;align-items:flex-start;min-height:76px}
.hero .l{font-size:12px;font-weight:600;opacity:.78;margin-bottom:4px}
.hero .v{font-size:22px;line-height:27px;font-weight:800;letter-spacing:-.02em}
.hero .s{font-size:12px;font-weight:600;opacity:.85;margin-top:3px}
.hero .cv{margin-left:auto;opacity:.9;align-self:center}
.stats{display:flex;gap:26px;margin-top:12px}
.stats .l{font-size:12px;color:var(--c3);font-weight:600;margin-bottom:3px}
.stats .v{font-size:16px;line-height:20px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--bg);border-radius:var(--r-s);padding:10px 12px}
.tile .t{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tile .t span{font-size:12px;font-weight:600;color:var(--c2)}
.tile .n{font-size:20px;line-height:24px;font-weight:700}
.tile.alert{background:#ef44440f}.tile.alert .n{color:var(--neg)}
.statcard{background:var(--surface);border-radius:var(--r-m);padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.statcard .n{font-size:20px;font-weight:800}
.statcard .ic{margin-left:auto;width:var(--h-ctrl);height:var(--h-ctrl);border-radius:var(--r-f);background:var(--ctrl2);display:grid;place-items:center}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 6px;border-radius:var(--r-f)}
.delta.up{background:#ef44441a;color:var(--neg)}
.delta.dn{background:#22c55e1a;color:var(--pos)}
.delta.w{background:#ffffff2e;color:#fff}

/* Segmented / Tabs: DS h48, radius-m */
.seg{display:inline-flex;background:var(--ctrl2);border-radius:var(--r-m);padding:4px;gap:4px}
.seg button{height:var(--h-btn-sm);padding:0 16px;border-radius:var(--r-s);font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;color:var(--c2);display:inline-flex;align-items:center}
.seg button.on{background:var(--surface);color:var(--c1);box-shadow:0 1px 2px #0000000f}
/* Chips: DS padding-12, radius-m 16, Body/M SemiBold */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--h-ctrl);padding:12px;border-radius:var(--r-m);background:var(--ctrl);font-size:var(--fs-m);line-height:var(--lh-m);font-weight:600;color:var(--c1);white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--accent-sub);color:var(--accent)}
.chip b{font-weight:600;color:inherit;opacity:.65}
.search{display:flex;align-items:center;gap:8px;height:var(--h-ctrl);background:var(--ctrl);border-radius:var(--r-m);padding:0 12px;min-width:220px;color:var(--c3);font-size:var(--fs-m);line-height:var(--lh-m)}
/* Button: DS h48 / px24 / radius-m 16 / Body-S SemiBold */
.btn{display:inline-flex;align-items:center;gap:8px;height:var(--h-btn);padding:0 24px;border-radius:var(--r-m);background:var(--accent);color:#fff;font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;white-space:nowrap}
.btn.g{background:var(--ctrl);color:var(--c1);box-shadow:none}
.btn.w{background:var(--surface);color:var(--c1);box-shadow:var(--shadow)}
.btn.sm{height:var(--h-btn-sm);padding:0 16px;border-radius:var(--r-s)}
/* текстовая кнопка: h28, без паддинга, Body/M accent */
.btn.link{height:28px;padding:0;background:none;box-shadow:none;color:var(--accent);border-radius:var(--r-s);font-size:var(--fs-m);line-height:var(--lh-m)}
.btn[disabled]{opacity:.45;pointer-events:none}
.tog{width:34px;height:19px;border-radius:var(--r-f);background:var(--bg3);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{background:var(--accent)}.tog.on::after{transform:translateX(15px)}

/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{background:var(--ctrl2);font-size:var(--fs-c);line-height:var(--lh-c);font-weight:500;color:var(--c2);text-align:left;padding:16px 12px;white-space:nowrap}
.tbl th:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.tbl th:last-child{border-radius:0 var(--r-s) var(--r-s) 0}
.tbl td{padding:15px 12px;font-size:var(--fs-s);line-height:var(--lh-s);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hl td{background:var(--accent-ghost)}
.tbl .num{text-align:right}
.tbl th svg,.tbl td svg{display:inline-block;vertical-align:middle;margin-left:4px}
.tag{display:inline-block;padding:4px 10px;border-radius:var(--r-s);font-size:var(--fs-c);line-height:var(--lh-c);font-weight:600;background:var(--accent-sub);color:var(--accent)}
.tag.y{background:#f59e0b1f;color:#8a5a00}
.tag.g{background:#22c55e1f;color:#15803d}
.tag.r{background:#ef44441f;color:#b91c1c}
.tag.n{background:var(--ctrl);color:var(--c2)}
.pager{display:flex;align-items:center;gap:8px;padding-top:12px}
.pager .pg{display:flex;gap:2px;margin-left:auto}
.pager .pg button{width:28px;height:28px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--c2)}
.pager .pg button.on{background:var(--surface);box-shadow:0 0 0 1px var(--border);color:var(--c1)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:44px 0 36px;text-align:center}
.empty .art{width:92px;height:72px;border-radius:var(--r-s);background:var(--accent-ghost);display:grid;place-items:center;color:var(--accent);font-size:24px;font-weight:800;margin-bottom:4px}
.empty b{font-size:15px;font-weight:700}
.empty p{font-size:12px;color:var(--c3);font-weight:500;max-width:250px}

/* misc blocks */
.callout{background:var(--bg);border-radius:var(--r-s);padding:14px 16px;position:relative}
.callout b{font-size:14px;font-weight:700;display:block;margin-bottom:8px}
.callout ol{margin-left:18px;font-size:14px;color:var(--c2);line-height:20px}
.callout .x{position:absolute;right:12px;top:12px;color:var(--c3)}
.warnbar{display:flex;gap:10px;align-items:flex-start;background:#f59e0b14;border-radius:var(--r-s);padding:12px 14px;font-size:14px;position:relative}
/* Поля: DS Input h56 / p12 / radius-m / label Caption-M + value Body-M */
.field{background:var(--ctrl);border-radius:var(--r-m);padding:12px;min-height:var(--h-field);display:flex;flex-direction:column;justify-content:center}
.field .k{font-size:var(--fs-c);line-height:var(--lh-c);color:var(--c2);font-weight:500}
.field .v{font-size:var(--fs-m);line-height:var(--lh-m);font-weight:500}
.urlrow{display:flex;align-items:center;gap:8px;background:var(--accent-sub);border-radius:var(--r-m);padding:12px;min-height:var(--h-field);margin-bottom:8px}
.urlrow .k{font-size:var(--fs-c);line-height:var(--lh-c);color:var(--c2);font-weight:500}
.urlrow .v{font-size:var(--fs-m);line-height:var(--lh-m);font-weight:500}
.linkrow{display:flex;align-items:center;gap:8px;background:var(--accent-sub);border-radius:var(--r-m);padding:12px;min-height:var(--h-field);margin-bottom:8px;font-size:var(--fs-m);line-height:var(--lh-m);font-weight:500}
.promo{background:linear-gradient(135deg,#eef1ff,#dbe2ff);border-radius:var(--r-m);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.promo h2{font-size:19px;line-height:24px;font-weight:800;max-width:72%;position:relative}
.promo .orb{position:absolute;right:-24px;bottom:-36px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c2e8 45%,#7b86b8 75%,#4a5480);opacity:.92}
.hex{width:82px;height:82px;border-radius:22px;display:grid;place-items:center;font-size:21px;font-weight:800;color:#fff;flex:0 0 auto}
.track{margin-top:14px}
.tbar{height:8px;border-radius:var(--r-f);background:var(--bg3);overflow:hidden}
.tfill{height:100%;background:var(--accent);border-radius:var(--r-f);transition:width .25s}
.tpts{display:flex;justify-content:space-between;margin-top:-16px}
.pt{display:flex;flex-direction:column;align-items:center;gap:6px}
.pt i{width:22px;height:22px;border-radius:7px;background:var(--bg3);border:3px solid var(--surface)}
.pt span{font-size:12px;font-weight:700;color:var(--c3)}
.pt.on span{color:var(--c1)}
.obs{display:flex;gap:10px;align-items:center;background:#f59e0b1a;border:1px solid #f59e0b40;color:#8a5a00;border-radius:var(--r-s);padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:700}
.foot{display:flex;gap:16px;padding:20px 0 24px;font-size:12px;color:var(--c3);font-weight:600;flex-wrap:wrap}
.foot .l{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:var(--bg)}
.auth .box{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-l);padding:28px;box-shadow:var(--shadow)}
.auth h1{font-size:24px;font-weight:800;margin-bottom:4px}
.auth p.s{font-size:14px;color:var(--c2);margin-bottom:20px}
.inp{background:var(--ctrl);border-radius:var(--r-m);padding:12px;margin-bottom:12px;min-height:var(--h-field);display:flex;flex-direction:column;justify-content:center}
.inp .k{font-size:var(--fs-c);line-height:var(--lh-c);color:var(--c2);font-weight:500}
.inp input{font-size:var(--fs-m);line-height:var(--lh-m);font-weight:500}
.tabs2{display:flex;gap:2px;background:var(--bg);border-radius:var(--r-xs);padding:3px;margin-bottom:18px}
.tabs2 button{flex:1;text-align:center;padding:8px;border-radius:var(--r-xs);font-size:14px;font-weight:600;color:var(--c2)}
.tabs2 button.on{background:var(--surface);color:var(--c1);box-shadow:0 1px 2px #0000000f}

/* modal */
.mask{position:fixed;inset:0;background:#1118273d;backdrop-filter:blur(2px);z-index:70;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border-radius:var(--r-l);padding:24px;width:100%;max-width:400px;box-shadow:0 24px 70px #0003;max-height:86vh;overflow:auto}
.modal h2{font-size:20px;font-weight:800;margin-bottom:6px}
.modal p.s{font-size:14px;color:var(--c2);margin-bottom:18px}
.modal .acts{display:flex;gap:8px;margin-top:20px}

/* scenario panel */
.sct{position:fixed;right:18px;bottom:18px;z-index:80;height:44px;padding:0 18px;border-radius:var(--r-f);background:#111827;color:#fff;font-size:14px;font-weight:700;box-shadow:0 8px 28px #0003;display:flex;align-items:center;gap:8px}
.sc{position:fixed;right:0;top:0;bottom:0;width:330px;z-index:81;background:var(--surface);box-shadow:-8px 0 40px #0000001f;padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .22s}
.sc.open{transform:none}
.sc h3{font-size:16px;font-weight:800}
.sc .hint{font-size:12px;color:var(--c3);font-weight:600;margin-bottom:16px}
.scg{margin-bottom:14px}
.scg>label{display:block;font-size:12px;font-weight:700;color:var(--c3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sco{display:flex;flex-wrap:wrap;gap:6px}
.sco button{padding:7px 11px;border-radius:var(--r-xs);background:var(--bg);font-size:12px;font-weight:600;color:var(--c2)}
.sco button.on{background:var(--accent);color:#fff}
.scx{position:absolute;right:14px;top:12px;color:var(--c3);font-size:22px}
.scf{border-top:1px solid var(--border);padding-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.scf button{padding:8px 12px;border-radius:var(--r-xs);background:var(--bg);font-size:12px;font-weight:700}
/* ===== СОСТОЯНИЯ И ИНТЕРАКТИВ ===== */
.btn,.chip,.seg button,.ib,.ni,.kid,.cb,.tog,.tile,.pop button,.pager .pg button{transition:background .15s,color .15s,box-shadow .15s,border-color .15s,opacity .15s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.btn:hover{filter:brightness(.95)}
.btn:active{transform:translateY(1px)}
.chip:not(.on):hover{background:#6b72802e}
.seg button:not(.on):hover{color:var(--c1)}
.ib:hover{color:var(--c1)}
.tile{cursor:pointer}
.tile:hover{background:var(--ctrl)}
.statcard:hover{box-shadow:0 6px 28px #cbd0e999}
/* таблица */
.tbl tbody tr[data-wk]{cursor:pointer}
.tbl tbody tr[data-wk]:hover td{background:var(--ctrl2)}
.tbl tbody tr.sel td{background:var(--accent-ghost)}
.srt{cursor:pointer;user-select:none}
.srt:hover{color:var(--c1)}
.srt.on{color:var(--accent)}
/* чекбокс */
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:inline-grid;place-items:center;background:var(--surface);cursor:pointer;color:#fff;flex:0 0 auto}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb svg{display:block;margin:0}
/* панель массовых действий */
.bulk{display:flex;align-items:center;gap:12px;background:var(--accent-sub);border-radius:var(--r-m);padding:12px;margin-bottom:12px;font-size:var(--fs-s);line-height:var(--lh-s)}
/* лента групп */
.geostrip{flex:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.geostrip::-webkit-scrollbar{display:none}
.lnk{color:inherit;font:inherit;cursor:pointer}
.lnk:hover{color:var(--accent)}
.linkrow svg{display:inline-block;vertical-align:-4px}
.promo .btn{align-self:flex-start}
.pager .pg button:not(:disabled):hover{background:var(--ctrl2)}
.pager .pg button:disabled{opacity:.35;pointer-events:none}
.search:focus-within{box-shadow:0 0 0 2px var(--accent-sub)}
.search input{font-size:var(--fs-m);line-height:var(--lh-m);color:var(--c1)}
/* тосты */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:12px 20px;border-radius:var(--r-m);font-size:var(--fs-s);line-height:var(--lh-s);font-weight:600;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.in{opacity:1;transform:none}
@media(max-width:1150px){.g3,.g4{grid-template-columns:1fr}.sb{display:none}}
</style>
</head>

function pager(id,total,per=10){
  const pages=Math.max(1,Math.ceil(total/per)), cur=Math.min(U.page[id]||1,pages);
  const from=total?(cur-1)*per+1:0, to=Math.min(cur*per,total);
  const nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-cur)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}
  return `<div class="pager"><span class="cap dim">Показано ${from}–${to} из ${ni(total)}</span>

function chart(m,opts={}){
  const W=1400,H=opts.h||290,PL=56,PR=opts.right===false?20:46,PT=12,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB, N=120, r=rng(S.coin==='btc'?7:13);
  const smooth=opts.smooth;
  let p=[];
  for(let i=0;i<N;i++){
    if(m.empty){p.push(0);continue}
    if(smooth) p.push(6+ (i/N)*70 + Math.sin(i/14)*7);
    else p.push(i<14 ? 2+r()*3 : Math.max(0,Math.min(100, 62+(r()-.5)*26+Math.sin(i/6)*6)));
  }
  const x=i=>PL+(i/(N-1))*iw, y=v=>PT+ih-(v/100)*ih;
  const ln=p.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ar=`${ln} L${x(N-1).toFixed(1)},${PT+ih} L${PL},${PT+ih} Z`;
  const ticks=opts.ticks||[0,150,300,450,600,750,900,1050,1200,1350,1500];
  const hrs=opts.xs||['14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00','00:00','01:00','02:00','03:00','04:00','05:00','06:00'];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none">
    <text x="${PL}" y="9" font-size="11" fill="var(--c3)" font-weight="600">${opts.yl||'Хэшрейт,'+m.c.short[0]}</text>
    ${opts.right===false?'':`<text x="${W-PR}" y="9" font-size="11" fill="var(--c3)" text-anchor="end" font-weight="600">Реджект,%</text>`}
    ${ticks.map((t,i)=>{const yy=PT+ih-(i/(ticks.length-1))*ih;return`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--border)"/>
      <text x="${PL-8}" y="${yy+3}" font-size="10" fill="var(--c3)" text-anchor="end">${m.empty?0:t}</text>
      ${opts.right===false?'':`<text x="${W-PR+8}" y="${yy+3}" font-size="10" fill="var(--c3)">${i*10}</text>`}`}).join('')}
    ${m.empty?'':`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <path d="${ar}" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      ${opts.right===false?'':`<path d="M${PL},${PT+ih-2} L${W-PR},${PT+ih-3}" fill="none" stroke="var(--warn)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`}`}
    ${hrs.map((h,i)=>`<text x="${PL+(i/(hrs.length-1))*iw}" y="${H-6}" font-size="10" fill="var(--c3)" text-anchor="middle">${h}</text>`).join('')}
  </svg>
  ${opts.right===false?'':`<div style="display:flex;justify-content:center;gap:20px;margin-top:8px">
    <span class="cap mut"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px"></i>Хэшрейт</span>
    <span class="cap mut"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px"></i>Реджект</span></div>`}`;
}

  for(let i=0;i<N;i++){
    const p=(i+.5)/N*tot; let acc=0, st='ok';
    for(const [k,v] of share){acc+=v; if(p<=acc){st=k;break}}
    const base=225+r()*15;
    out.push({id:i+1,name:'Ant'+String(i+1).padStart(2,'0'),model:models[i%4],st,
      h5:base+5,h1:base+12,h24:base+8,rej:((i%8)+1)/100,up:99+(i%2),tag:tags[i%3],extra:i%2});
  }
  return out;
}

  let rows=workersList(m);
  if(U.wfilter!=='all') rows=rows.filter(w=>w.st===U.wfilter);
  const q=U.q.trim().toLowerCase();
  if(q) rows=rows.filter(w=>(w.name+' '+w.model).toLowerCase().includes(q));
  const s=U.sort.workers;
  if(s) rows=[...rows].sort((a,b)=>{const x=a[s.k],y=b[s.k];
    return (typeof x==='string'?String(x).localeCompare(String(y)):x-y)*s.d});
  return rows;
}

    <div class="ch" style="gap:6px">${['BTC','LTC + DOGE'].map((x,i)=>`<button class="chip ${i===0?'on':''}">${x}</button>`).join('')}</div>
    ${[3333,4444,5555].map((p,i)=>`<div class="urlrow"><div><div class="k">URL ${i+1}</div><div class="v mono">stratum+tcp://ss.promminer.ru:${p}</div></div><button class="spacer lnk" style="color:var(--accent)" data-copy="stratum+tcp://ss.promminer.ru:${p}">${I.cp}</button></div>`).join('')}

  wallet:{ok:'Кошелёк добавлен',t:'Добавить кошелек',s:'Адрес будет использоваться для выводов по этой монете',b:()=>`

  withdraw:{ok:'Заявка на вывод создана',t:'Вывод средств',s:'Средства уйдут на подтвержденный адрес',b:m=>`

  subacct:{ok:'Суб-аккаунт создан',t:'Создать суб-аккаунт',s:'Суб-аккаунт получит собственные адреса подключения',b:()=>`
    <div class="inp"><div class="k">Имя аккаунта</div><input placeholder="latin, 3–20 символов"></div>
    <div class="inp"><div class="k">Комментарий</div><input placeholder="Необязательно"></div>`},
  observer:{ok:'Ссылка наблюдателя создана',t:'Создать ссылку наблюдателя',s:'Доступ только для чтения',b:()=>`
    <div class="inp"><div class="k">Название</div><input value="Для бухгалтера"></div>
    <div class="ch" style="gap:6px;margin-top:10px">${['Воркеры','Финансы','Отчет'].map((x,i)=>`<button class="chip ${i<2?'on':''}">${x}</button>`).join('')}</div>`},
};

/* ============================================================
   8. ХЕДЕР, САЙДБАР, СБОРКА
   ============================================================ */
function notifications(){
  const n=NOTIF_N[S.notif];
  const list=[['Воркер Ant07 ушел в оффлайн','Последняя шара 2 часа назад','12 мин назад'],
    ['Выплата отправлена','0,01254 BTC на bc1q…4f2a','1 ч назад'],
    ['Новый реферал','miner_1042 зарегистрировался по вашей ссылке','вчера'],
    ['Отчет за апрель сгенерирован','Доступен для скачивания','2 дня назад']];
  if(!n) return `<div class="pop"><div class="empty" style="padding:28px 12px"><b>Уведомлений нет</b><p>Здесь появятся события по вашему парку</p></div></div>`;
  return `<div class="pop" style="min-width:330px"><b class="ph">Уведомления</b>
    ${list.map((x,i)=>`<div class="note ${i>=n?'read':''}"><i></i><div><b>${x[0]}</b><p>${x[1]}</p><span>${x[2]}</span></div></div>`).join('')}
    <div class="hr"></div><button style="justify-content:center;color:var(--accent)" data-readall data-toast="Все уведомления отмечены как прочитанные">Прочитать все</button></div>`;
}
function header(m){
  const n=NOTIF_N[S.notif];
  const acct=S.acct==='main'?'natarusso':'alfred';
  /* Хедер по DS: белая панель, снизу radius-l 24, padding 20/8, ряд px16 gap16.
     Контролы h48, border 1px, radius-m 16, без тени. Заголовок H3 32/38 SemiBold. */
  return `<header class="top"><div class="toprow"><h1 class="h3">${TITLES[route]||''}</h1>
    <div class="hgroup">
    <button class="hbtn" data-go="assets">${I.rub}<span class="mono">${nf(m.pool)}</span></button>
    <span class="pop-wrap"><button class="hbtn sq" data-pop="notif"><span class="i3">${I.bell}</span>${n?`<span class="bdg">${n>99?'99+':n}</span>`:''}</button>${pop==='notif'?notifications():''}</span>
    <span class="pop-wrap"><button class="hbtn" data-pop="acct">${route==='monitor'?'Сводка по аккаунтам (46)':acct}${I.cd}</button>
      ${pop==='acct'?`<div class="pop"><b class="ph">Аккаунты</b>${ACCOUNTS.map((a,i)=>`<button class="${a===acct?'on':''}" data-acct="${i===0?'main':'sub'}">${a}${i===0?' · основной':''}</button>`).join('')}
        <div class="hr"></div><button data-go="subaccounts">${I.pl} Управление суб-аккаунтами</button>
        <button data-go="monitor">${I.mon} Сводка по аккаунтам</button></div>`:''}</span>
    <span class="pop-wrap"><button class="hbtn tight" data-pop="user"><span class="i3">${I.user}</span>${I.cd}</button>
      ${pop==='user'?`<div class="pop"><b class="ph">Профиль</b>
        ${PROF.map(([id,t])=>`<button data-go="${id}">${t}</button>`).join('')}
        <div class="hr"></div><button data-go="auth" style="color:var(--neg)">Выйти</button></div>`:''}</span>
    </div></div></header>`;
}
function coinbar(m){
  const showCoin=['home','workers','income','payouts','calc','monitor','ref'].includes(route);
  if(!showCoin) return '';
  const extra=route==='workers'&&S.role==='owner'
    ?`<div class="spacer"></div><button class="btn w sm">Серийные номера ${I.cv}</button><button class="btn sm" data-modal="connect">${I.pl} Подключить воркера</button>`
    :route==='home'?`<span class="spacer rate mono">${m.c.rate}</span>`:'';
  return `<div class="subbar"><span class="pop-wrap"><button class="pill" data-pop="coin"><span style="color:${m.c.tint};font-weight:800">${m.c.icon}</span> ${m.c.label} ${I.cd}</button>
    ${pop==='coin'?`<div class="pop left" style="min-width:190px">${AXES.coin.opts.map(([v,t])=>`<button class="${S.coin===v?'on':''}" data-axis="coin" data-val="${v}">${COINS[v].icon} ${t}${S.coin===v?' ✓':''}</button>`).join('')}</div>`:''}</span>${extra}</div>`;
}
function sidebar(){
  const item=(o)=>{
    if(o.kids){
      const active=GROUP_OF[route]===o.g;
      const open=openGroups[o.g]||active;
      return `<button class="ni ${open?'open':''} ${active?'act':''}" data-grp="${o.g}"><span class="nic">${I[o.ic]}</span><span class="lbl">${o.t}</span><span class="chev lbl">${I.cd}</span></button>
        ${open?`<div class="kids">${o.kids.map(([id,t])=>`<button class="kid ${route===id?'on':''}" data-go="${id}">${t}</button>`).join('')}</div>`:''}`;
    }
    return `<button class="ni ${route===o.id?'on':''}" data-go="${o.id}"><span class="nic">${I[o.ic]}</span><span class="lbl">${o.t}</span></button>`;
  };
  return `<aside class="sb"><div class="logo"><i>P</i><div class="lbl"><b>promminer</b><span>POOL</span></div></div>
    <nav class="nav">${NAV.map(item).join('')}</nav>
    <div class="sep"></div>
    <div style="padding:0 12px"><button class="ni"><span class="nic">${I.book}</span><span class="lbl">База знаний</span><span class="spacer lbl nic">${I.ext}</span></button></div>
    <button class="mini-btn" id="minib"><span class="nic">${I.cl}</span><span class="lbl">Свернуть</span></button></aside>`;
}
function render(){
  const m=M();
  if(route==='auth'){document.getElementById('root').innerHTML=V.auth();renderPanel();sync();return}
  const view=(V[route]||(()=>card('<div class="empty"><b>Экран в работе</b></div>')))(m);
  document.getElementById('root').innerHTML=`<div class="app">${sidebar()}
    <main class="main">${header(m)}<div class="page">${coinbar(m)}${view}
      <div class="foot"><span>© 2026 Promminer Pool. Все права защищены</span>
      <span class="l"><a href="#">Оферта</a><a href="#">Политика конфиденциальности</a><a href="#">Пользовательское соглашение</a><a href="#">Политика обработки персональных данных</a><a href="#">Реквизиты</a></span></div>
    </div></main></div>${modal?modalHTML(m):''}`;
  if(U.qfocus){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  renderPanel();sync();
}
function modalHTML(m){
  const d=MODALS[modal];if(!d)return'';
  return `<div class="mask" data-close><div class="modal"><h2>${d.t}</h2><p class="s">${d.s}</p>${d.b(m)}
    <div class="acts"><button class="btn" data-close data-toast="${d.ok||'Готово'}">Подтвердить</button><button class="btn g" data-close>Отмена</button></div></div></div>`;
}

/* ============================================================
   9. СОСТОЯНИЕ И СОБЫТИЯ
   ============================================================ */
function renderPanel(){
  document.getElementById('scb').innerHTML=Object.entries(AXES).map(([k,a])=>`
    <div class="scg"><label>${a.label}</label><div class="sco">${a.opts.map(([v,t])=>`<button data-axis="${k}" data-val="${v}" class="${S[k]===v?'on':''}">${t}</button>`).join('')}</div></div>`).join('')
    +`<div class="scg"><label>Экран</label><div class="sco">${Object.entries(TITLES).map(([id,t])=>`<button data-go="${id}" class="${route===id?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function sync(){const q=new URLSearchParams({...S,route});history.replaceState(null,'','#'+q);try{localStorage.setItem('pm',q.toString())}catch(e){}}
function load(){let s=location.hash.slice(1);if(!s){try{s=localStorage.getItem('pm')||''}catch(e){}}
  const q=new URLSearchParams(s);for(const k in DEF)if(q.get(k))S[k]=q.get(k);if(q.get('route'))route=q.get('route')}

function toast(msg){
  const w=document.getElementById('toasts');if(!w||!msg)return;
  const el=document.createElement('div');el.className='toast';el.textContent=msg;w.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),220)},2400);
}
document.addEventListener('input',e=>{
  const q=e.target.closest('#q');
  if(q){U.q=q.value;U.page.workers=1;U.qfocus=true;render()}
});
document.addEventListener('click',e=>{
  const t=e.target;
  /* --- интерактив таблиц и контролов --- */
  const sg=t.closest('[data-seg]');if(sg){U.seg[sg.dataset.seg]=+sg.dataset.i;render();return}
  const wf=t.closest('[data-wf]');if(wf){U.wfilter=wf.dataset.wf;U.page.workers=1;render();return}
  const sk=t.closest('[data-sortk]');if(sk){const k=sk.dataset.sortk,s=U.sort.workers;
    U.sort.workers=(s&&s.k===k)?(s.d>0?{k,d:-1}:null):{k,d:1};render();return}
  const pg2=t.closest('[data-page]');if(pg2&&!pg2.disabled){U.page[pg2.dataset.page]=+pg2.dataset.p;render();return}
  const sl=t.closest('[data-sel]');if(sl){const id=+sl.dataset.sel;U.sel.has(id)?U.sel.delete(id):U.sel.add(id);render();return}
  if(t.closest('[data-selall]')){const m2=M(),rows=workersRows(m2),per=10,
    pages=Math.max(1,Math.ceil(rows.length/per)),cur=Math.min(U.page.workers||1,pages),
    page=rows.slice((cur-1)*per,cur*per), on=page.every(w=>U.sel.has(w.id));
    page.forEach(w=>on?U.sel.delete(w.id):U.sel.add(w.id));render();return}
  if(t.closest('[data-selclear]')){U.sel.clear();render();return}
  const geo=t.closest('[data-geo]');if(geo){U.geo=U.geo===geo.dataset.geo?'':geo.dataset.geo;render();return}
  const tf=t.closest('[data-tilef]');if(tf){U.wfilter=tf.dataset.tilef;U.page.workers=1;route='workers';render();scrollTo(0,0);return}
  const sc2=t.closest('[data-scroll]');if(sc2){const s2=document.getElementById('geostrip');
    if(s2)s2.scrollBy({left:+sc2.dataset.scroll*320,behavior:'smooth'});return}
  const cp=t.closest('[data-copy]');if(cp){navigator.clipboard?.writeText(cp.dataset.copy);toast('Скопировано');return}
  const wk=t.closest('[data-wk]');if(wk){const m2=M();U.wk=workersList(m2).find(w=>w.id===+wk.dataset.wk)||null;
    route='worker';pop=null;render();scrollTo(0,0);return}
  if(t.closest('[data-readall]')){S.notif='none';pop=null;render();toast('Все уведомления отмечены как прочитанные');return}
  const tst=t.closest('[data-toast]');
  if(t.closest('[data-close]')){modal=null;render();if(tst)toast(tst.dataset.toast);return}
  if(tst){toast(tst.dataset.toast);return}
  const ax=t.closest('[data-axis]');if(ax){S[ax.dataset.axis]=ax.dataset.val;pop=null;render();return}
  const md=t.closest('[data-modal]');if(md){modal=md.dataset.modal;pop=null;render();return}
  const go=t.closest('[data-go]');if(go){route=go.dataset.go;pop=null;modal=null;const g=GROUP_OF[route];if(g)openGroups[g]=true;render();scrollTo(0,0);return}
  const gp=t.closest('[data-grp]');if(gp){openGroups[gp.dataset.grp]=!openGroups[gp.dataset.grp];render();return}
  const ac=t.closest('[data-acct]');if(ac){S.acct=ac.dataset.acct;pop=null;render();return}
  const pp=t.closest('[data-pop]');if(pp){pop=pop===pp.dataset.pop?null:pp.dataset.pop;render();return}
  const tg=t.closest('[data-tog]');if(tg){tg.classList.toggle('on');return}
  if(t.closest('#minib')){mini=!mini;document.body.classList.toggle('mini',mini);return}
  if(t.closest('#sct')||t.closest('#scx')){document.getElementById('sc').classList.toggle('open');return}
  if(t.closest('#scr')){S={...DEF};route='home';modal=null;render();return}
  if(t.closest('#scc')){navigator.clipboard?.writeText(location.href);t.textContent='Скопировано';setTimeout(()=>t.textContent='Скопировать ссылку',1200);return}
  if(pop&&!t.closest('.pop-wrap')){pop=null;render()}
});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal){modal=null;render()}else if(pop){pop=null;render()}}
  if((e.key==='s'||e.key==='ы')&&!/input|textarea/i.test(e.target.tagName))document.getElementById('sc').classList.toggle('open')});

addEventListener('hashchange',()=>{load();render()});
load();render();
</script>
